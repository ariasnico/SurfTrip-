<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Surf Runner - Chapadmalal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      overflow: hidden;
      touch-action: none;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #87CEEB;
    }

    canvas {
      display: block;
    }

    /* --- Start Screen --- */
    #start-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #87CEEB 0%, #B0E0E6 40%, #E0F0FF 70%, #F5E6CA 90%, #EDDcB3 100%);
      z-index: 20;
      gap: 16px;
      padding: 24px;
      text-align: center;
    }

    #start-screen.hidden {
      display: none;
    }

    #start-screen h1 {
      font-size: clamp(2rem, 8vw, 3.5rem);
      color: #1a6b8a;
      text-shadow: 2px 2px 0 rgba(255,255,255,0.6);
      line-height: 1.1;
    }

    #start-screen .subtitle {
      font-size: clamp(0.9rem, 3vw, 1.2rem);
      color: #3a8aa8;
      max-width: 320px;
    }

    #start-screen .emoji-hero {
      font-size: clamp(4rem, 15vw, 7rem);
      animation: bobbing 2s ease-in-out infinite;
    }

    @keyframes bobbing {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    #start-screen .controls-hint {
      font-size: clamp(0.8rem, 2.5vw, 1rem);
      color: #5a9ab5;
      background: rgba(255,255,255,0.5);
      padding: 10px 20px;
      border-radius: 12px;
      max-width: 300px;
    }

    .btn {
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      font-weight: 700;
      padding: 16px 48px;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-start {
      background: linear-gradient(135deg, #FF9A56, #FF6B35);
      color: white;
      box-shadow: 0 4px 15px rgba(255, 107, 53, 0.4);
    }

    /* --- Game Over Overlay --- */
    #game-over {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(26, 107, 138, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 10;
      gap: 12px;
      padding: 24px;
      text-align: center;
    }

    #game-over.active {
      display: flex;
    }

    #game-over h2 {
      font-size: clamp(2.5rem, 10vw, 4rem);
      color: #FFF;
      text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
    }

    #game-over .wipeout-emoji {
      font-size: clamp(3rem, 12vw, 5rem);
    }

    #game-over .final-score {
      font-size: clamp(1.2rem, 4vw, 1.8rem);
      color: #E0F0FF;
    }

    #game-over .high-score {
      font-size: clamp(0.9rem, 3vw, 1.1rem);
      color: #a0d8ef;
    }

    .btn-restart {
      background: linear-gradient(135deg, #56D67B, #2ECC55);
      color: white;
      box-shadow: 0 4px 15px rgba(46, 204, 85, 0.4);
      min-width: 220px;
    }

    /* --- HUD --- */
    #hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: none;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      padding-top: max(12px, env(safe-area-inset-top));
      z-index: 5;
      font-size: clamp(1rem, 3.5vw, 1.3rem);
      font-weight: 700;
      color: #1a6b8a;
      pointer-events: none;
    }

    #hud.active {
      display: flex;
    }

    #hud .score-display {
      background: rgba(255,255,255,0.7);
      padding: 6px 14px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <!-- Start Screen -->
  <div id="start-screen">
    <div class="emoji-hero">🏄‍♂️</div>
    <h1>Surf Runner</h1>
    <p class="subtitle">Surfeando las olas de Chapadmalal</p>
    <div class="controls-hint">
      Toca la pantalla para saltar.<br>
      Esquiva lobos marinos 🦭 y rocas 🪨<br>
      Junta medialunas 🥐 y mates 🧉
    </div>
    <button class="btn btn-start" id="btn-play">Surfeaaaar!</button>
  </div>

  <!-- Game Canvas -->
  <canvas id="game-canvas"></canvas>

  <!-- HUD -->
  <div id="hud">
    <span class="score-display" id="score-label">0 pts</span>
    <span class="score-display" id="hi-label">HI: 0</span>
  </div>

  <!-- Game Over -->
  <div id="game-over">
    <div class="wipeout-emoji">🌊😵</div>
    <h2>Wipeout!</h2>
    <p class="final-score" id="final-score">Puntos: 0</p>
    <p class="high-score" id="high-score">Record: 0</p>
    <button class="btn btn-restart" id="btn-restart">Volver al agua!</button>
  </div>

<script>
// ============================================================
// SURF RUNNER - Endless Runner Game
// ============================================================

(() => {
  // --- DOM refs ---
  const canvas = document.getElementById('game-canvas');
  const ctx = canvas.getContext('2d');
  const startScreen = document.getElementById('start-screen');
  const gameOverScreen = document.getElementById('game-over');
  const hud = document.getElementById('hud');
  const scoreLabel = document.getElementById('score-label');
  const hiLabel = document.getElementById('hi-label');
  const finalScoreEl = document.getElementById('final-score');
  const highScoreEl = document.getElementById('high-score');
  const btnPlay = document.getElementById('btn-play');
  const btnRestart = document.getElementById('btn-restart');

  // --- Constants ---
  const GRAVITY = 0.6;
  const JUMP_FORCE = -13;
  const GROUND_RATIO = 0.78;           // ground Y as ratio of canvas height
  const PLAYER_SIZE_RATIO = 0.065;     // player size relative to canvas width
  const MIN_PLAYER_SIZE = 36;
  const MAX_PLAYER_SIZE = 60;
  const BASE_SPEED = 4;
  const MAX_SPEED = 10;
  const SPEED_INCREMENT = 0.0008;
  const OBSTACLE_INTERVAL_MIN = 60;
  const OBSTACLE_INTERVAL_MAX = 140;
  const COLLECTIBLE_INTERVAL_MIN = 90;
  const COLLECTIBLE_INTERVAL_MAX = 200;
  const COLLECTIBLE_POINTS = 50;

  // --- Pastel beach palette ---
  const COLORS = {
    skyTop:     '#87CEEB',
    skyBottom:  '#B0E0E6',
    seaLight:   '#A8D8EA',
    seaDark:    '#7EC8E3',
    foam:       '#E0F7FA',
    sand:       '#F5E6CA',
    sandDark:   '#EDDcB3',
  };

  // --- Game state ---
  let width, height, groundY, playerSize;
  let player, obstacles, collectibles;
  let score, hiScore, speed, frameCount;
  let nextObstacleIn, nextCollectibleIn;
  let running, gameOver;
  let animId;

  // Waves decorative
  let waveOffset = 0;

  // Load hi-score
  hiScore = parseInt(localStorage.getItem('surfrunner_hi') || '0', 10);

  // --- Resize ---
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    groundY = height * GROUND_RATIO;
    playerSize = Math.min(MAX_PLAYER_SIZE, Math.max(MIN_PLAYER_SIZE, width * PLAYER_SIZE_RATIO));
  }
  window.addEventListener('resize', resize);
  resize();

  // --- Player ---
  function createPlayer() {
    return {
      x: width * 0.12,
      y: groundY - playerSize,
      w: playerSize,
      h: playerSize,
      vy: 0,
      grounded: true,
    };
  }

  // --- Spawn helpers ---
  function spawnObstacle() {
    const emojis = ['🦭', '🪨'];
    const emoji = emojis[Math.floor(Math.random() * emojis.length)];
    const size = playerSize * (0.8 + Math.random() * 0.4);
    obstacles.push({
      x: width + size,
      y: groundY - size,
      w: size,
      h: size,
      emoji,
    });
    nextObstacleIn = randInt(OBSTACLE_INTERVAL_MIN, OBSTACLE_INTERVAL_MAX);
  }

  function spawnCollectible() {
    const emojis = ['🥐', '🧉'];
    const emoji = emojis[Math.floor(Math.random() * emojis.length)];
    const size = playerSize * 0.85;
    // Float at jump height (randomized a bit)
    const floatY = groundY - playerSize * (1.8 + Math.random() * 1.5);
    collectibles.push({
      x: width + size,
      y: floatY,
      w: size,
      h: size,
      emoji,
      collected: false,
    });
    nextCollectibleIn = randInt(COLLECTIBLE_INTERVAL_MIN, COLLECTIBLE_INTERVAL_MAX);
  }

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  // --- Collision (AABB with shrink) ---
  function collides(a, b, shrink) {
    const s = shrink || 0.25;
    const ax = a.x + a.w * s;
    const ay = a.y + a.h * s;
    const aw = a.w * (1 - 2 * s);
    const ah = a.h * (1 - 2 * s);
    const bx = b.x + b.w * s;
    const by = b.y + b.h * s;
    const bw = b.w * (1 - 2 * s);
    const bh = b.h * (1 - 2 * s);
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  // --- Init game ---
  function initGame() {
    resize();
    player = createPlayer();
    obstacles = [];
    collectibles = [];
    score = 0;
    speed = BASE_SPEED;
    frameCount = 0;
    nextObstacleIn = 60;
    nextCollectibleIn = 120;
    running = true;
    gameOver = false;
    waveOffset = 0;
  }

  // --- Jump ---
  function jump() {
    if (!running || gameOver) return;
    if (player.grounded) {
      player.vy = JUMP_FORCE;
      player.grounded = false;
    }
  }

  // --- Update ---
  function update() {
    frameCount++;

    // Speed ramps up
    if (speed < MAX_SPEED) {
      speed += SPEED_INCREMENT;
    }

    // Score ticks with time
    score += Math.round(speed * 0.5);

    // Player physics
    player.vy += GRAVITY;
    player.y += player.vy;
    if (player.y >= groundY - player.h) {
      player.y = groundY - player.h;
      player.vy = 0;
      player.grounded = true;
    }

    // Obstacles
    nextObstacleIn--;
    if (nextObstacleIn <= 0) spawnObstacle();

    for (let i = obstacles.length - 1; i >= 0; i--) {
      obstacles[i].x -= speed;
      if (obstacles[i].x + obstacles[i].w < 0) {
        obstacles.splice(i, 1);
        continue;
      }
      if (collides(player, obstacles[i])) {
        endGame();
        return;
      }
    }

    // Collectibles
    nextCollectibleIn--;
    if (nextCollectibleIn <= 0) spawnCollectible();

    for (let i = collectibles.length - 1; i >= 0; i--) {
      collectibles[i].x -= speed;
      if (collectibles[i].x + collectibles[i].w < 0) {
        collectibles.splice(i, 1);
        continue;
      }
      if (!collectibles[i].collected && collides(player, collectibles[i], 0.15)) {
        collectibles[i].collected = true;
        score += COLLECTIBLE_POINTS;
        // Remove after brief flash
        collectibles.splice(i, 1);
      }
    }

    // Wave animation offset
    waveOffset = (waveOffset + speed * 0.6) % (width * 0.5);
  }

  // --- Draw ---
  function draw() {
    // Sky gradient
    const skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
    skyGrad.addColorStop(0, COLORS.skyTop);
    skyGrad.addColorStop(1, COLORS.skyBottom);
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, width, groundY);

    // Decorative clouds (static simple)
    drawClouds();

    // Sea waves (decorative, behind ground)
    drawWaves();

    // Ground / sand
    const sandGrad = ctx.createLinearGradient(0, groundY, 0, height);
    sandGrad.addColorStop(0, COLORS.sand);
    sandGrad.addColorStop(1, COLORS.sandDark);
    ctx.fillStyle = sandGrad;
    ctx.fillRect(0, groundY, width, height - groundY);

    // Foam line at shore
    ctx.fillStyle = COLORS.foam;
    ctx.fillRect(0, groundY - 3, width, 6);

    // Obstacles
    for (const ob of obstacles) {
      ctx.font = `${ob.h}px serif`;
      ctx.textBaseline = 'top';
      ctx.fillText(ob.emoji, ob.x, ob.y);
    }

    // Collectibles
    for (const c of collectibles) {
      if (!c.collected) {
        ctx.font = `${c.h}px serif`;
        ctx.textBaseline = 'top';
        ctx.fillText(c.emoji, c.x, c.y);
      }
    }

    // Player
    ctx.font = `${player.h}px serif`;
    ctx.textBaseline = 'top';
    ctx.fillText('🏄‍♂️', player.x, player.y);

    // HUD update
    scoreLabel.textContent = `${score} pts`;
    hiLabel.textContent = `HI: ${hiScore}`;
  }

  // Simple cloud positions (seeded from width so they look stable)
  let clouds = [];
  function initClouds() {
    clouds = [];
    const count = Math.max(3, Math.floor(width / 250));
    for (let i = 0; i < count; i++) {
      clouds.push({
        x: (width / count) * i + Math.random() * 100,
        y: 30 + Math.random() * (groundY * 0.35),
        r: 20 + Math.random() * 25,
      });
    }
  }

  function drawClouds() {
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    for (const c of clouds) {
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, c.r * 2.2, c.r, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(c.x - c.r, c.y + 4, c.r * 1.4, c.r * 0.8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(c.x + c.r * 1.2, c.y + 2, c.r * 1.5, c.r * 0.75, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawWaves() {
    const waveY = groundY - 8;
    ctx.fillStyle = COLORS.seaLight;
    ctx.beginPath();
    ctx.moveTo(0, waveY);
    for (let x = 0; x <= width; x += 6) {
      const y = waveY + Math.sin((x + waveOffset) * 0.025) * 5
                       + Math.sin((x + waveOffset * 0.7) * 0.04) * 3;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(width, groundY);
    ctx.lineTo(0, groundY);
    ctx.closePath();
    ctx.fill();

    // Second wave layer
    ctx.fillStyle = COLORS.seaDark + '66';
    ctx.beginPath();
    ctx.moveTo(0, waveY + 3);
    for (let x = 0; x <= width; x += 6) {
      const y = waveY + 3 + Math.sin((x + waveOffset * 1.3) * 0.03) * 4
                            + Math.sin((x + waveOffset * 0.5) * 0.05) * 2;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(width, groundY);
    ctx.lineTo(0, groundY);
    ctx.closePath();
    ctx.fill();
  }

  // --- Game loop ---
  function loop() {
    if (!running) return;
    update();
    draw();
    animId = requestAnimationFrame(loop);
  }

  // --- End game ---
  function endGame() {
    running = false;
    gameOver = true;
    cancelAnimationFrame(animId);

    if (score > hiScore) {
      hiScore = score;
      localStorage.setItem('surfrunner_hi', String(hiScore));
    }

    finalScoreEl.textContent = `Puntos: ${score}`;
    highScoreEl.textContent = `Record: ${hiScore}`;
    gameOverScreen.classList.add('active');
    hud.classList.remove('active');
  }

  // --- Start ---
  function startGame() {
    startScreen.classList.add('hidden');
    gameOverScreen.classList.remove('active');
    hud.classList.add('active');
    initGame();
    initClouds();
    loop();
  }

  // --- Event listeners ---
  btnPlay.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });
  btnRestart.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });

  // Touch / click to jump (not on buttons)
  function handleInteraction(e) {
    if (!running || gameOver) return;
    e.preventDefault();
    jump();
  }

  canvas.addEventListener('touchstart', handleInteraction, { passive: false });
  canvas.addEventListener('mousedown', handleInteraction);

  // Keyboard support (spacebar)
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === ' ') {
      e.preventDefault();
      if (!running && !gameOver) {
        // On start/gameover screen, spacebar starts
        if (!startScreen.classList.contains('hidden')) {
          startGame();
        }
      } else {
        jump();
      }
    }
  });

  // Show hi-score on start screen
  hiLabel.textContent = `HI: ${hiScore}`;
})();
</script>

</body>
</html>
